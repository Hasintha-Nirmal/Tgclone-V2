version: '3.8'

services:
  # ── Main Application ──────────────────────────────────────────────────────
  # MongoDB is MongoDB Atlas (cloud) — no local container needed.
  # Set MONGODB_URL in .env with your Atlas connection string.
  telegram-automation:
    build: .
    container_name: telegram-automation
    ports:
      - "8000:8000"
    volumes:
      - ./sessions:/app/sessions          # Telegram session files (persistent!)
      - app-logs:/app/logs                 # Application logs (named volume = no permission issues)
      - telegram-downloads:/app/downloads # Temp media (ephemeral)
    env_file:
      - .env                              # MONGODB_URL must be Atlas URL here
    restart: unless-stopped
    networks:
      - telegram-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis (optional) ──────────────────────────────────────────────────────
  # Enable with: docker-compose --profile with-redis up -d
  redis:
    image: redis:7-alpine
    container_name: telegram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - telegram-net
    profiles:
      - with-redis

volumes:
  app-logs:            # Application logs (named volume avoids bind-mount permission issues)
  telegram-downloads:  # Ephemeral - media files auto-deleted after upload
  redis-data:

networks:
  telegram-net:
    driver: bridge
